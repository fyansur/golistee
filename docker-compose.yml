services:
  db:
    image: postgres:16-alpine
    container_name: golistee_db
    environment:
      POSTGRES_USER: golistee
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: golistee
    volumes:
      - golistee_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golistee -d golistee"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: golistee_server
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  golistee_data:
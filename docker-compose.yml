services:
  db:
    image: postgres:16-alpine
    container_name: golistee_db
    environment:
      POSTGRES_USER: golistee
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: golistee
    ports:
      # Hanya bisa diakses dari VPS sendiri, tidak terbuka ke publik
      - "127.0.0.1:5434:5432"
    volumes:
      - golistee_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golistee -d golistee"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  golistee_data:
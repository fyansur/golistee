name: Deploy Golistee

on:
  push:
    branches: [main]
  workflow_dispatch:

# Jangan jalankan dua deployment bersamaan pada VPS yang sama.
concurrency:
  group: golistee-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -Eeuo pipefail

            APP_DIR="/opt/golistee"
            SERVER_DIR="$APP_DIR/server"
            CLIENT_DIR="$APP_DIR/client"
            PM2_APP="golistee-server"

            cd "$APP_DIR"

            # Sinkronkan source VPS dengan branch main di GitHub.
            git fetch --prune origin main
            git reset --hard origin/main

            # Docker Compose dipakai hanya untuk PostgreSQL.
            docker compose up -d db

            # Build frontend; hasilnya ada di client/dist.
            cd "$CLIENT_DIR"
            npm ci
            npm run build

            # .env production hanya berada di VPS—jangan pernah overwrite dari GitHub Actions.
            cd "$SERVER_DIR"
            test -f .env || {
              echo "ERROR: $SERVER_DIR/.env tidak ditemukan."
              exit 1
            }

            npm ci
            npx prisma generate --config prisma7.config.ts
            npx prisma migrate deploy --config prisma7.config.ts

            # Backend menggunakan TSX sesuai setup PM2 saat ini.
            if pm2 describe "$PM2_APP" > /dev/null 2>&1; then
              pm2 restart "$PM2_APP" --update-env
            else
              pm2 start npx \
                --name "$PM2_APP" \
                --cwd "$SERVER_DIR" \
                -- tsx src/index.ts
              pm2 save
            fi

            # Deployment dianggap gagal jika backend tidak sehat.
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 10 \
              --retry-delay 2 \
              --retry-connrefused \
              http://127.0.0.1:3000/health

            echo "Deploy Golistee selesai."